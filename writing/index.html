<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研英语写作 · 功能句样板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Microsoft YaHei',system-ui,sans-serif;background:#f0f3f8;color:#1f2937;line-height:1.7;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:44px 20px 80px}
.hero{text-align:center;margin-bottom:32px}
.hero .tag{display:inline-block;background:#e8eef7;color:#1a3a6b;font-size:13px;font-weight:600;padding:5px 14px;border-radius:999px;margin-bottom:14px}
h1{font-size:30px;color:#12294d;letter-spacing:1px}
.sub{color:#889;font-size:15px;margin-top:10px}
.backtop{display:inline-block;margin-bottom:14px;font-size:13px;color:#1a3a6b;text-decoration:none}
.backtop:hover{text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:8px}
.card{display:block;background:#fff;border:1px solid #e0e6f0;border-radius:16px;padding:22px 24px;text-decoration:none;color:inherit;box-shadow:0 2px 8px rgba(18,41,77,.05);transition:.18s}
a.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(26,58,107,.16);border-color:#9db8dd}
.card .yr{font-size:13px;font-weight:700;color:#1a3a6b;background:#e8eef7;padding:3px 10px;border-radius:999px}
.card .t{display:block;font-size:19px;font-weight:700;margin-top:12px;color:#12294d}
.card .d{display:block;font-size:13px;color:#64748b;margin-top:6px;min-height:38px}
.card .go{display:inline-block;margin-top:12px;font-size:14px;font-weight:600;color:#1a3a6b}
footer{text-align:center;color:#94a3b8;font-size:12.5px;margin-top:44px}
</style>
</head>
<body>
<div class="wrap">
  <a class="backtop" href="../index.html">← 返回其他站点集合</a>
  <header class="hero">
    <div class="tag">英语 · 大作文</div>
    <h1>写作功能句样板</h1>
    <p class="sub">第一课 · 第二课 · 功能句直接套用</p>
  </header>
  <div class="grid">
    <a class="card" href="lesson1.html">
      <span class="yr">大作文 · 第一课</span>
      <span class="t">功能句九句式完整版</span>
      <span class="d">前三句式扩展为九句式完整样板：原句 / 变形 / 使用说明齐备。</span>
      <span class="go">进入 →</span>
    </a>
    <a class="card" href="lesson2.html">
      <span class="yr">大作文 · 第二课</span>
      <span class="t">功能句十二句式（变形披露）</span>
      <span class="d">十二句式样板，每句附变形披露：展开变形过程与填空框架。</span>
      <span class="go">进入 →</span>
    </a>
  </div>
  <footer>考研英语写作 · 功能句样板</footer>
</div>
</body>
</html>
