<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>高中频简单词速刷</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; background: #f0f3f8; min-height: 100vh; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px; }
  h1 { color: #1a3a6b; font-size: 26px; margin-bottom: 6px; }
  .sub { color: #889; margin-bottom: 28px; font-size: 14px; }
  .cards { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .card { background: #fff; border-radius: 10px; padding: 20px 22px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(26,58,107,.08); text-decoration: none; transition: transform .12s, box-shadow .12s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(26,58,107,.15); }
  .card h2 { color: #1a3a6b; font-size: 18px; margin-bottom: 4px; }
  .card p { color: #778; font-size: 13px; }
  .badge { background: #eef2f8; color: #1a3a6b; border-radius: 999px; padding: 4px 12px; font-size: 13px; white-space: nowrap; }
  .panel { background: #fff; border-radius: 10px; padding: 20px 22px; margin-top: 26px; box-shadow: 0 2px 8px rgba(26,58,107,.08); }
  .panel h3 { color: #1a3a6b; font-size: 16px; margin-bottom: 12px; }
  .panel label { display: block; font-size: 13px; color: #556; margin: 10px 0 4px; }
  .panel input { width: 100%; padding: 8px 10px; border: 1px solid #ccd5e3; border-radius: 6px; font-size: 13px; font-family: inherit; }
  .btnrow { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn { padding: 8px 18px; border-radius: 6px; border: none; background: #1a3a6b; color: #fff; font-size: 14px; cursor: pointer; font-family: inherit; }
  .btn:hover { background: #2a4f8f; }
  .btn.plain { background: #fff; color: #1a3a6b; border: 1px solid #1a3a6b; }
  .btn.plain:hover { background: #eef2f8; }
  #syncStatus { font-size: 13px; color: #778; margin-top: 10px; }
  .backlink { display: inline-block; color: #1a3a6b; font-size: 14px; margin-bottom: 18px; text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="backlink" href="../index.html">← 返回 其他站点集合</a>
    <h1>高中频简单词速刷</h1>
    <div class="sub">轮次模式：点勾标记一看就会的词 → 保存本轮 → 已会词移出词表 → 导出记录交 AI 剔除</div>
    <div class="cards">
      <a class="card" href="list1.html"><div><h2>第 1 份词表</h2><p>全量 1258 词 · 原顺序 · 轮次版</p></div><span class="badge" id="stat1">—</span></a>
      <a class="card" href="list2.html"><div><h2>第 2 份词表</h2><p>全量 1258 词 · 原顺序 · 轮次版</p></div><span class="badge" id="stat2">—</span></a>
      <a class="card" href="list3.html"><div><h2>第 3 份词表</h2><p>全量 1258 词 · 原顺序 · 轮次版</p></div><span class="badge" id="stat3">—</span></a>
    </div>
    <div class="panel">
      <h3>GitHub 全站同步（一次同步 = 三份词表进度全部同步）</h3>
      <label>GitHub fine-grained PAT（需本仓库 Contents 写权限；只存本机浏览器，不上传任何第三方）</label>
      <input id="pat" type="password" placeholder="github_pat_...">
      <label>仓库（默认已填好，一般不用改）</label>
      <input id="repo" type="text">
      <div class="btnrow">
        <button class="btn" onclick="saveCfg()">保存设置</button>
        <button class="btn plain" onclick="uploadSync()">⬆ 上传同步（本机 → GitHub）</button>
        <button class="btn plain" onclick="downloadSync()">⬇ 下载合并（GitHub → 本机）</button>
      </div>
      <div id="syncStatus"></div>
    </div>
  </div>
<script>
  var LIST_KEYS = { 1: 'kaoyan-full1-v2-state', 2: 'kaoyan-full2-v2-state', 3: 'kaoyan-full3-v2-state' };
  function readListState(n) { try { return JSON.parse(localStorage.getItem(LIST_KEYS[n])) || { round: 1, mastered: {} }; } catch (e) { return { round: 1, mastered: {} }; } }
  function refreshStats() {
    for (var n = 1; n <= 3; n++) {
      var s = readListState(n);
      document.getElementById('stat' + n).textContent = '第 ' + s.round + ' 轮 · 已掌握 ' + Object.keys(s.mastered || {}).length + ' 词';
    }
  }
  function saveCfg() {
    var pat = document.getElementById('pat').value.trim();
    var repo = document.getElementById('repo').value.trim();
    if (pat) localStorage.setItem('hub_pat', pat);
    if (repo) localStorage.setItem('hub_repo', repo);
    document.getElementById('syncStatus').textContent = '设置已保存（PAT 只存本机）。';
  }
  window.addEventListener('load', function () {
    document.getElementById('pat').value = localStorage.getItem('hub_pat') || '';
    document.getElementById('repo').value = localStorage.getItem('hub_repo') || 'shuoshizaiyuan/study-log-data';
    refreshStats();
  });
</script>
<script>
  // ===== GitHub 全站同步（fine-grained PAT, contents API）=====
  var SYNC_FILE = 'site-data/speed-brush.json';
  function hubPat() { return localStorage.getItem('hub_pat') || ''; }
  function hubRepo() { return localStorage.getItem('hub_repo') || 'shuoshizaiyuan/study-log-data'; }
  var LIST_KEYS = { 1: 'kaoyan-full1-v2-state', 2: 'kaoyan-full2-v2-state', 3: 'kaoyan-full3-v2-state' };
  function readListState(n) { try { return JSON.parse(localStorage.getItem(LIST_KEYS[n])) || { round: 1, mastered: {}, history: [] }; } catch (e) { return { round: 1, mastered: {}, history: [] }; } }
  function writeListState(n, s) { localStorage.setItem(LIST_KEYS[n], JSON.stringify(s)); }
  function collectAll() {
    var out = {};
    for (var n = 1; n <= 3; n++) { var s = readListState(n); out['list' + n] = { round: s.round, mastered: s.mastered, history: s.history }; }
    return { updatedAt: new Date().toISOString(), lists: out };
  }
  function mergeList(local, remote) {
    if (!remote) return local;
    var l = local || { round: 1, mastered: {}, history: [] };
    var r = remote;
    var mastered = Object.assign({}, l.mastered || {});
    Object.keys(r.mastered || {}).forEach(function (w) {
      if (mastered[w] === undefined || (r.mastered[w] || 99) < mastered[w]) mastered[w] = r.mastered[w];
    });
    var hm = {};
    (l.history || []).concat(r.history || []).forEach(function (h) {
      if (!hm[h.round]) hm[h.round] = { round: h.round, words: [] };
      hm[h.round].words = Array.from(new Set(hm[h.round].words.concat(h.words || [])));
    });
    var history = Object.keys(hm).map(function (k) { return hm[k]; }).sort(function (a, b) { return a.round - b.round; });
    return { round: Math.max(l.round || 1, r.round || 1), mastered: mastered, history: history };
  }
  function ghReq(url, opts) {
    opts.headers = Object.assign({ 'Authorization': 'Bearer ' + hubPat(), 'Accept': 'application/vnd.github+json', 'User-Agent': 'vocab-site' }, opts.headers || {});
    return fetch(url, opts);
  }
  async function getRemoteSync() {
    var res = await ghReq('https://api.github.com/repos/' + hubRepo() + '/contents/' + SYNC_FILE, { method: 'GET' });
    if (res.status === 404) return { sha: null, data: null };
    if (!res.ok) throw new Error('GET ' + res.status + ': ' + await res.text());
    var j = await res.json();
    return { sha: j.sha, data: JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, ''))))) };
  }
  async function uploadSync() {
    if (!hubPat()) { alert('请先在设置里粘贴 GitHub PAT（需本仓库 Contents 写权限）。'); return; }
    try {
      var remote = await getRemoteSync();
      var body = { message: 'speed-brush sync ' + new Date().toISOString(), content: btoa(unescape(encodeURIComponent(JSON.stringify(collectAll(), null, 1)))) };
      if (remote.sha) body.sha = remote.sha;
      var res = await ghReq('https://api.github.com/repos/' + hubRepo() + '/contents/' + SYNC_FILE, { method: 'PUT', body: JSON.stringify(body) });
      if (!res.ok) throw new Error('PUT ' + res.status + ': ' + await res.text());
      alert('上传成功：三份词表进度已同步到 GitHub。');
    } catch (e) { alert('上传失败：' + e.message); }
  }
  async function downloadSync() {
    if (!hubPat()) { alert('请先在设置里粘贴 GitHub PAT。'); return; }
    try {
      var remote = await getRemoteSync();
      if (!remote.data) { alert('远端还没有同步数据。'); return; }
      for (var n = 1; n <= 3; n++) {
        var merged = mergeList(readListState(n), (remote.data.lists || {})['list' + n]);
        writeListState(n, merged);
      }
      if (typeof render === 'function') render();
      var u = document.getElementById('syncStatus');
      if (u) u.textContent = '下载合并完成 · 远端更新时间 ' + remote.data.updatedAt;
      alert('下载合并成功（远端与本端按词合并，进度取并集）。');
    } catch (e) { alert('下载失败：' + e.message); }
  }
</script>
</html>
